    <style>
      html, body, #root {
        margin: 0;
        min-height: 100%;
        background: #0a0a0f;
      }
      body {
        overflow-x: hidden;
      }
      .hero-gradient{background:linear-gradient(135deg,#0a0a0f 0%,#1a1020 50%,#0a0a0f 100%)}.hero-title{font-size:clamp(2rem,5vw,4rem);font-weight:700;line-height:1.1;color:#fff}.hero-subtitle{font-size:clamp(1rem,3vw,1.25rem);color:rgba(255,255,255,.7);margin-bottom:2rem}.btn-primary{display:inline-flex;align-items:center;gap:.5rem;padding:1rem 2rem;background:linear-gradient(135deg,#ec4899,#f43f5e);color:#fff;border:none;border-radius:.75rem;font-weight:600;font-size:1rem;cursor:pointer;transition:all .3s ease}.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 25px -5px rgba(236,72,153,.3)}.loading-skeleton{background:linear-gradient(90deg,rgba(255,255,255,.05) 25%,rgba(255,255,255,.1) 50%,rgba(255,255,255,.05) 75%);background-size:200% 100%;animation:loading 1.5s infinite}@keyframes loading{0%{background-position:200% 0}100%{background-position:-200% 0}}.text-gradient{background:linear-gradient(135deg,#ec4899,#f43f5e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}.fade-in{animation:fadeIn 0.6s ease-out}@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
      .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
      #hero{background-color:#0d0d0d !important}
      #hero h1{color:#f2f2f2 !important}
      #hero h1 span{color:#d9277a !important}
      #hero p{color:#d1d5db !important}
      .animate-fade-in{animation:none !important;opacity:1 !important;transform:none !important}
      #app-shell {
        background-color: #0a0a0f;
        min-height: 100vh;
        color: white;
        font-family: Inter, sans-serif;
      }
      .shell-nav {
        height: 60px;
        background: #111015;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        padding: 0 24px;
        gap: 12px;
        position: sticky;
        top: 0;
        z-index: 50;
      }
      .shell-logo-circle {
        width: 36px; height: 36px;
        border-radius: 50%;
        background: #1a1020;
      }
      .shell-logo-text {
        width: 120px; height: 14px;
        border-radius: 7px;
        background: #1a1020;
      }
      .shell-hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: calc(100vh - 60px);
        padding: 40px 24px;
        text-align: center;
      }
      .shell-badge {
        width: 220px; height: 28px;
        border-radius: 14px;
        background: #1a1020;
        margin: 0 auto 32px;
      }
      .shell-h1-line1 {
        width: 85%; max-width: 500px; height: 44px;
        border-radius: 8px;
        background: #1a1020;
        margin: 0 auto 16px;
      }
      .shell-h1-line2 {
        width: 60%; max-width: 340px; height: 44px;
        border-radius: 8px;
        background: #2a1030;
        margin: 0 auto 24px;
      }
      .shell-subtitle {
        width: 75%; max-width: 420px; height: 20px;
        border-radius: 6px;
        background: #1a1020;
        margin: 0 auto 12px;
      }
      .shell-subtitle-2 {
        width: 55%; max-width: 300px; height: 20px;
        border-radius: 6px;
        background: #1a1020;
        margin: 0 auto 40px;
      }
      .shell-cta {
        width: 200px; height: 52px;
        border-radius: 26px;
        background: #d9277a;
        margin: 0 auto 32px;
        opacity: 0.9;
      }
      .shell-stars {
        width: 120px; height: 16px;
        border-radius: 4px;
        background: #1a1020;
        margin: 0 auto 8px;
      }
      .shell-trust {
        width: 180px; height: 14px;
        border-radius: 4px;
        background: #1a1020;
        margin: 0 auto;
      }
      @keyframes shimmer {
        0% { opacity: 0.4; }
        50% { opacity: 0.8; }
        100% { opacity: 0.4; }

      .shell-h1-line1, .shell-h1-line2, .shell-subtitle,
      .shell-subtitle-2, .shell-stars, .shell-trust {
